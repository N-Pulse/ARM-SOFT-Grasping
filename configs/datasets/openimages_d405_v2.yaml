# Pinned inputs of the Open Images + D405 detection dataset, version 2.
# Build with: python training/data/prepare_dataset.py all --config configs/datasets/openimages_d405_v2.yaml
# Change any value below -> bump `name` (and the output names) to a new version.
#
# v2 vs v1: new Hugging Face repo npulseDataCV/npulse_cv (revision 5a6e9a3), which also holds
# captures under the `yanis/` sub-root; first D405 door_handle and ball (marble) data; more
# can, box and pen sessions; hands, prosthetic hand and eggs (ellipsoid) as negative frames.
# Decisions (2026-11-20): marble -> ball, yellow_marker -> pen_pencil. Which door-handle
# sessions show the same physical handle is unknown, so test door handles may have been seen
# in train; treat door_handle test numbers as optimistic.
version: 1
name: openimages6_d405_v2
classes:            # fixed order = YOLO class ids 0-5
  - ball
  - can
  - box
  - bottle
  - pen_pencil
  - door_handle

openimages:
  output: training/datasets/openimages6     # unchanged: same frozen Open Images subset as v1
  per_class: 500
  seed: 0

huggingface:
  repo_id: npulseDataCV/npulse_cv
  repo_type: dataset
  revision: 5a6e9a3c6c4ec4ec10653cab97486df3b5876b91
  output: training/sources/npulse_cv-5a6e9a3

d405:
  output_name: d405_v2
  train_repeat: 2           # D405 train is ~4x larger than v1; 5 would crowd out Open Images
  link_mode: hardlink       # hardlink = one copy on disk; use --link-mode copy before zipping
  # Folders of the snapshot that are Dataset Studio roots ("" = the top level).
  subroots: ["", "yanis"]
  # Dataset Studio class name -> YOLO class. Studio IDs differ between sessions: match by name.
  class_map:
    can: can
    box: box
    door_handle: door_handle
    ball-pen: pen_pencil
    red_pen: pen_pencil
    stylo: pen_pencil
    yellow_marker: pen_pencil
    marble: ball
  # Whole sessions per split. v1 test sessions stay in test; test adds new objects.
  session_splits:
    train: [can_1, can_2, can_3, can_4, can_6, can_8, can_9,
            test-black-box-3, test_box_3, test_box_4, test_box_7,
            door_handle_1, door_handle_3, Door_Handle_5, Door_Handle_circular_1, Door_Handle_regular_1,
            red_pen_0, Stylo_4colors_1, Stylo_4colors_2, yellow_marker, yellow_marker_1,
            marble_1]
    val: [can_5, box-beige-1, test_box8,
          door_handle_4, Door_Handle_regular_2,
          red_pen_1, Stylo_4colors_3, yellow_marker_2]
    test: [can_7, can_10, test-box-2, test_box_9,
           Door_Handle_6, Door_Handle_circular_2,
           stylo_green_1, marbles_1]
  # Approved frames whose objects are none of the six classes: written with empty labels,
  # so the model learns not to fire on eggs and hands.
  negative_sessions:
    train: [ellipsoid, ellipsoid_2, left_hand_relaxed, left_hand_relaxed_1,
            right_hand_relaxed_0, right_hand_relaxed_1, proth_right_hand, proth_right_hand_1]
    val: [ellipsoid_3, left_hand_relaxed_2, right_hand_relaxed_2, proth_right_hand_2]
    test: [right-hand-3fingers-1, right-hand-thumbs-up-1]
  # Not used: red_pen_2 (0 approved), test-box-1 (1 approved), right-hand-thumbs-up-2
  # (labelled "object"). Approved but rejected after visual control (carried over from v1):
  excluded_frames:
    can_4:
      frame_000007: 3 of its 4 boxes are on the empty table
      frame_000008: box cuts the top of the can
      frame_000009: box cuts the top of the can
    can_5:
      frame_000004: box cuts the top of the can
      frame_000008: box cuts the top of the can
      frame_000009: box cuts the top of the can
      frame_000010: box cuts the top of the can
      frame_000011: box cuts the top of the can
      frame_000013: box cuts the top of the can
      frame_000014: box cuts the top of the can

mixed:
  output_name: openimages6_d405_v2
  yaml: training/data/openimages6_d405_v2.yaml
